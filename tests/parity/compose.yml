services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: local-fixture-only
      MARIADB_ROOT_PASSWORD: local-root-fixture-only
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - db:/var/lib/mysql
  wordpress:
    image: wordpress:php8.4-apache
    ports:
      - 127.0.0.1:8096:80
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-fixture-only
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('DISALLOW_FILE_EDIT', true);
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - wordpress:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/digital-xperts-social-meta:ro
      - ../../../d-x.pl/wordpress/digital-xperts-dx-pl:/var/www/html/wp-content/plugins/digital-xperts-dx-pl:ro
      - ../../../d-x.pl/wordpress/digital-xperts-social-meta:/var/www/html/wp-content/plugins/dxsm-old:ro
      - ../../../../Rs2.pl/wordpress/digital-xperts-social-meta-rs2:/var/www/html/wp-content/plugins/digital-xperts-social-meta-rs2:ro
  cli:
    image: wordpress:cli-php8.4
    user: 0:0
    entrypoint: [wp, --allow-root, --path=/var/www/html]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: local-fixture-only
    volumes:
      - wordpress:/var/www/html
      - ../..:/var/www/html/wp-content/plugins/digital-xperts-social-meta:ro
      - ../../../d-x.pl/wordpress/digital-xperts-dx-pl:/var/www/html/wp-content/plugins/digital-xperts-dx-pl:ro
      - ../../../d-x.pl/wordpress/digital-xperts-social-meta:/var/www/html/wp-content/plugins/dxsm-old:ro
      - ../../../../Rs2.pl/wordpress/digital-xperts-social-meta-rs2:/var/www/html/wp-content/plugins/digital-xperts-social-meta-rs2:ro
      - .:/tests:ro
volumes:
  db:
  wordpress:
